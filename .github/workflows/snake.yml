# Gera a animação da cobrinha e os cards de estatísticas e linguagens a partir do gráfico de contribuições
# e publica os SVGs na branch `output`, que o README usa. Os dois ficam no mesmo workflow
# porque a publicação substitui a branch inteira.
name: Gerar cobrinha e estatísticas

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Ações de terceiros fixadas por commit (não por tag): uma tag movida não roda código novo com o token de escrita.
# Para atualizar, troque o SHA pelo do novo release e o comentário com a versão.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Teste quebrado não publica card quebrado
      - name: Testes do gerador dos cards
        run: python3 -I -m unittest discover -s tests

      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Só dados públicos do perfil (inclui a contagem anônima das contribuições privadas);
      # usa o token automático do Actions, sem token pessoal.
      - name: Cards de estatísticas e linguagens
        # A dist/ sai do container da cobrinha como root
        run: |
          sudo chown -R "$USER" dist
          python3 -I .github/scripts/estatisticas.py "${{ github.repository_owner }}" dist "Estatísticas do GitHub de João Pedro Drummond"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
